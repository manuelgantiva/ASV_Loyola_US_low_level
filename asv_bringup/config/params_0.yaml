        # Vessel Mass and Damping
        # Surge inertia term: m11 = m - X_udot (kg)
        # MAX value (27.88 kg) computed using m = 25.73 kg, X_udot = -2.15 kg
        #M11: 27.88 # [kg] (Range: 24.00-27.88 kg)
        M11: 7.8 
        # Sway inertia term: m22 = m - Y_vdot (kg)
        # MAX value (48.32 kg) using Y_vdot = -22.59 kg
        #M22: 48.32 # [kg] (Range: 27.32-48.32 kg)
        M22: 8.4
        # MAX value (7.16 kg·m²) using I_z = 2.81 kg·m², N_rdot = -4.35 kg·m²
        #M33: 7.16 # [kg·m²] (Range: 4.81-7.16 kg·m²)
        M33: 0.4
        # Sway-Yaw coupling term: m32 = m*x_g (kg·m)
        # NOTE: Sign convention mismatch - technical report specifies NOMINAL = -0.478 kg·m
        # This value (0.527 kg·m) appears to use |MAX| magnitude with positive sign
        #M32 = 0.527  # [kg·m] (Reported range: -0.527 to -0.443 kg·m)

        # Surge linear damping: Xu (kg)
        # MAX (least damping): -0.27 kg (Range: -2.15 to -0.27 kg)
        #D11: -0.27
        D11: 20.7
        # Sway linear damping: Yv (kg) 
        # MAX (least damping): -3.59 kg (Range: -22.59 to -3.59 kg)
        #D22: -3.59
        D22: 26.5
        #D33: -3.74
        D33: 2.2
        # Formation and Vessel Geometry
